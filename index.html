<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="A simple and easy-to-use language translation tool."
    >

    <title>Language Translator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="translator-container">
       
        <!-- Header -->
        <header class="translator-header">
            <h1>🌐 Language Translator</h1>
            <p>Translate text quickly and easily</p>
        </header>


        <!-- Language Selection -->
        <section class="language-selection">

            <div class="language-box">
                <label for="sourceLanguage">From</label>

                <select id="sourceLanguage">
                    <option value="en">English</option>
                    <option value="hi">Hindi</option>
                    <option value="fr">French</option>
                    <option value="es">Spanish</option>
                    <option value="de">German</option>
                    <option value="it">Italian</option>
                    <option value="pt">Portuguese</option>
                    <option value="ru">Russian</option>
                    <option value="ja">Japanese</option>
                    <option value="ko">Korean</option>
                </select>
            </div>


            <!-- Swap Languages -->
            <button
                id="swapButton"
                class="swap-button"
                type="button"
                aria-label="Swap languages"
                title="Swap languages"
            >
                ⇄
            </button>


            <div class="language-box">
                <label for="targetLanguage">To</label>

                <select id="targetLanguage">
                    <option value="hi">Hindi</option>
                    <option value="en">English</option>
                    <option value="fr">French</option>
                    <option value="es">Spanish</option>
                    <option value="de">German</option>
                    <option value="it">Italian</option>
                    <option value="pt">Portuguese</option>
                    <option value="ru">Russian</option>
                    <option value="ja">Japanese</option>
                    <option value="ko">Korean</option>
                </select>
            </div>

        </section>


        <!-- Translation Area -->
        <!-- Translation Area -->
<section class="translation-area">

    <!-- Input -->
    <div class="text-box">

        <div class="box-header">
            <span>Your Text</span>

            <div class="box-actions">
                <button
                    id="inputSpeakButton"
                    type="button"
                    class="icon-button"
                    title="Speak input text"
                    aria-label="Speak input text"
                >
                    🔊
                </button>

                <span id="characterCount">0 / 500</span>
            </div>
        </div>

        <textarea
            id="inputText"
            maxlength="500"
            placeholder="Enter text to translate..."
            aria-label="Text to translate"
        ></textarea>

    </div>


    <!-- Output -->
    <div class="text-box">

        <div class="box-header">
            <span>Translation</span>

            <div class="box-actions">

                <button
                    id="copyButton"
                    type="button"
                    class="icon-button"
                    title="Copy translation"
                    aria-label="Copy translation"
                >
                    📋
                </button>

                <button
                    id="speakButton"
                    type="button"
                    class="icon-button"
                    title="Speak translation"
                    aria-label="Speak translation"
                >
                    🔊
                </button>

                <span id="status" aria-live="polite"></span>

            </div>
        </div>

        <textarea
            id="outputText"
            placeholder="Translation will appear here..."
            aria-label="Translated text"
            readonly
        ></textarea>

    </div>

</section>


        <!-- Translate Button -->
        <button
            id="translateButton"
            class="translate-button"
            type="button"
        >
            Translate
        </button>


        <!-- Action Buttons -->
        <div class="action-buttons">

            <button
                id="clearButton"
                type="button"
                title="Clear text"
            >
                🗑 Clear
            </button>

        </div>
    </main>


    <script src="script.js"></script>

</body>

</html>
